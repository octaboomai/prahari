<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Prahari{% endblock %} · Prahari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="topbar">
    <div class="wordmark">PRAHARI<span>.</span></div>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' else '' }}">Incidents</a>
      <a href="/log-sources" class="{{ 'active' if '/log-sources' in request.url.path else '' }}">Retention</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
    </nav>
  </div>
  <div class="page">
    {% block content %}{% endblock %}
  </div>
  <script src="/static/clock.js"></script>
</body>
</html>
